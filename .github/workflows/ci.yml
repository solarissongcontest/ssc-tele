name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Production build
        run: bun run build

      - name: Verify Solaris bridge route generation
        run: grep -Fq "api.solaris-admin-proxy" src/routeTree.gen.ts

      - name: TypeScript bridge validation
        shell: bash
        run: |
          set +e
          output="$(bun run typecheck 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if printf '%s\n' "$output" | grep -Fq "src/routes/api.solaris-admin-proxy.ts"; then
            echo "::error::The Solaris admin bridge has a TypeScript error."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::warning::The legacy Vote Hub still has pre-existing TypeScript errors outside the Solaris bridge."
          fi
